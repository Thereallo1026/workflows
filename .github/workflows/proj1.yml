name: proj1

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      S3_ENDPOINT: https://${{ secrets.PROJ1_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${{ secrets.PROJ1_R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PROJ1_R2_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.PROJ1_R2_BUCKET }}
      S3_REGION: auto
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              bundles: "appimage",
              pattern: "*.AppImage",
              platform: "linux-x86_64",
            }
          - {
              os: windows-latest,
              bundles: "nsis",
              pattern: "*-setup.exe",
              platform: "windows-x86_64",
            }
          - {
              os: macos-latest,
              bundles: "app,dmg",
              pattern: "*.dmg",
              platform: "darwin-aarch64",
            }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PROJ1_REPO }}
          token: ${{ secrets.PROJ1_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.os }}

      - name: System deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libappindicator3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio gstreamer1.0-alsa

      - name: Install
        run: bun install --frozen-lockfile >> build.log 2>&1

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PROJ1_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PROJ1_SIGNING_PASSWORD }}
        run: bunx tauri build --bundles ${{ matrix.bundles }} >> build.log 2>&1

      - name: Upload to R2
        env:
          PLATFORM: ${{ matrix.platform }}
          PATTERN: ${{ matrix.pattern }}
        run: bun scripts/ci/upload.ts >> build.log 2>&1

      - name: Report failure
        if: failure()
        env:
          LOG_FILE: build.log
          LOG_KEY: logs/${{ github.run_id }}-${{ matrix.platform }}.log
        run: |
          if [ -f build.log ]; then
            bun scripts/ci/log.ts || true
            echo "build failed; log at $LOG_KEY"
          else
            echo "failed before build; no log captured"
          fi

  dicts:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: https://${{ secrets.PROJ1_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${{ secrets.PROJ1_R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PROJ1_R2_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.PROJ1_R2_BUCKET }}
      S3_REGION: auto
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PROJ1_REPO }}
          token: ${{ secrets.PROJ1_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile >> build.log 2>&1

      - name: Build Dict
        run: bun scripts/ci/upload-dicts.ts >> build.log 2>&1

      - name: Report Error
        if: failure()
        env:
          LOG_FILE: build.log
          LOG_KEY: logs/${{ github.run_id }}-dicts.log
        run: |
          if [ -f build.log ]; then
            bun scripts/ci/log.ts || true
            echo "dictionary upload failed; log at $LOG_KEY"
          else
            echo "failed before dictionary generation; no log captured"
          fi

  manifest:
    needs: build
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: https://${{ secrets.PROJ1_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      S3_ACCESS_KEY_ID: ${{ secrets.PROJ1_R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.PROJ1_R2_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.PROJ1_R2_BUCKET }}
      S3_REGION: auto
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PROJ1_REPO }}
          token: ${{ secrets.PROJ1_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Assemble latest.json
        run: bun scripts/ci/manifest.ts >> build.log 2>&1

      - name: Report failure
        if: failure()
        env:
          LOG_FILE: build.log
          LOG_KEY: logs/${{ github.run_id }}-manifest.log
        run: |
          if [ -f build.log ]; then
            bun scripts/ci/log.ts || true
            echo "manifest failed; log at $LOG_KEY"
          else
            echo "failed before manifest; no log captured"
          fi
